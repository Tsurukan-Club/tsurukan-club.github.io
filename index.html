<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TSURUKAN CLUB</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TSURUKAN"><link rel="apple-touch-icon" href="./tsurukan-icon-180.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f8fb;background:#111827}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:900px;margin:auto;padding:20px}header{padding-top:32px}h1{margin:0;letter-spacing:2px}h1 span{color:#ef7777}small,.muted{color:#aab2c2}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px 0}nav button{min-width:0;overflow-wrap:anywhere}@media(min-width:650px){nav{display:flex;flex-wrap:wrap}nav button{flex:1}}button,input,select,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #536074}button{background:#374151;color:white;cursor:pointer;font-weight:650}button.primary,.active{background:#aa302b;border-color:#aa302b}button:disabled{opacity:.5}input,select,textarea{background:#fff;color:#172033;width:100%;margin:6px 0 12px}label{display:block;margin-top:8px}section,.card{background:#1f2937;border-radius:16px;padding:18px;margin:12px 0}.card{background:#293448}p{line-height:1.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.status{padding:12px;border-radius:10px;background:#27344a;margin:12px 0;white-space:pre-wrap}.danger{background:#7f2424}.ok{background:#20523b}a{color:#b9d5ff}footer{color:#aab2c2;font-size:13px}.pill{font-size:12px;background:#45536b;border-radius:100px;padding:4px 10px}.action{margin-top:8px}
</style></head><body><header><h1>TSURUKAN <span>CLUB</span></h1><div id="identity" class="muted">Panel klubowy</div></header><main><div id="notice" class="status hidden" role="status"></div><section id="setup" class="hidden"><h2>Konfiguracja</h2><p>Uzupełnij w pliku <code>index.html</code> wartości SUPABASE_URL i SUPABASE_ANON_KEY. Następnie wykonaj plik SQL w panelu Supabase.</p></section><section id="auth"><h2>Logowanie</h2><label>E-mail<input id="email" type="email" autocomplete="email"></label><label>Hasło<input id="password" type="password" autocomplete="current-password"></label><div class="row"><button class="primary" id="login">Zaloguj</button><button id="register">Zarejestruj się</button></div><button id="forgot" class="action">Wyślij link do zmiany hasła</button><p class="muted">Nowe konta wymagają zatwierdzenia przez administratora.</p></section><div id="app" class="hidden"><nav id="tabs"></nav><div id="content"></div><button id="logout">Wyloguj</button></div></main><footer>TSURUKAN CLUB • Wersja testowa • Płatności online nie są aktywne.</footer><script>
// PUBLICZNE dane Supabase (Project URL i anon/public key). Nigdy nie wpisuj service_role key.
const SUPABASE_URL='https://vqvtoybgtjqoszhbviki.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_MhZ2kl3FL5oxFcESt2Z5XQ_RbSFQIDi';
const $=id=>document.getElementById(id), configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_ANON_KEY.startsWith('WPISZ');
let session=null,profile=null,tab='Treningi';const admin=()=>profile?.role==='admin';const staff=()=>['admin','trainer'].includes(profile?.role);
function notice(s,error=false){$('notice').textContent=s;$('notice').className='status '+(error?'danger':'ok')}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function request(path,{method='GET',body,auth=true,headers={}}={}){const h={'apikey':SUPABASE_ANON_KEY,...headers};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;if(body!==undefined)h['Content-Type']='application/json';const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});let data=await r.text();try{data=data?JSON.parse(data):null}catch{}if(!r.ok)throw Error(data?.message||data?.error_description||data?.msg||JSON.stringify(data)||'Błąd '+r.status);return data}
const rest=(table,query='',options={})=>request('/rest/v1/'+table+'?'+query,{...options,headers:{Accept:'application/json',...options.headers}});
function saveSession(s){session=s;sessionStorage.setItem('tsurukan_session',JSON.stringify(s))}
async function refresh(){if(!session?.refresh_token)return false;try{const s=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},auth:false});saveSession(s);return true}catch{saveSession(null);return false}}
async function withAuth(fn){if(session?.expires_at&&session.expires_at*1000<Date.now()+60000)await refresh();try{return await fn()}catch(e){if(/JWT expired|invalid JWT/i.test(e.message)&&await refresh())return fn();throw e}}
async function signIn(){const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:$('email').value.trim(),password:$('password').value},auth:false});saveSession({...data,expires_at:Math.floor(Date.now()/1000)+data.expires_in});$('password').value='';await loadUser()}
async function register(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8)throw Error('Podaj e-mail i hasło (co najmniej 8 znaków).');const full_name=prompt('Imię i nazwisko:');if(!full_name?.trim())return;await request('/auth/v1/signup',{method:'POST',body:{email,password,data:{full_name:full_name.trim()}},auth:false});notice('Rejestracja wysłana. Potwierdź e-mail, jeśli Supabase tego wymaga, i poczekaj na zatwierdzenie konta.')}
async function forgot(){const email=$('email').value.trim();if(!email)throw Error('Najpierw wpisz adres e-mail.');await request('/auth/v1/recover',{method:'POST',body:{email},auth:false});notice('Jeśli konto istnieje, wysłano wiadomość z instrukcją zmiany hasła.')}
function logout(){saveSession(null);profile=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('identity').textContent='Panel klubowy'}
async function loadUser(){if(!session?.access_token){logout();return}const u=await withAuth(()=>request('/auth/v1/user'));const rows=await withAuth(()=>rest('profiles','id=eq.'+encodeURIComponent(u.id)+'&select=*'));profile=rows?.[0];if(!profile)throw Error('Profil nie został jeszcze utworzony. Sprawdź konfigurację bazy.');$('identity').textContent=(profile.full_name||u.email)+' • '+profile.role;$('auth').classList.add('hidden');$('app').classList.remove('hidden');if(!profile.approved){$('tabs').innerHTML='';$('content').innerHTML='<section><h2>Oczekiwanie na zatwierdzenie</h2><p>Administrator musi zaakceptować Twoje konto. Po zatwierdzeniu odśwież stronę.</p></section>';return}await render()}
const tabs=['Treningi','Wydarzenia','Płatności','Statystyki','Profil','Zarządzanie'];
async function render(){if(!profile?.approved)return loadUser();$('tabs').innerHTML=tabs.filter(t=>t!=='Zarządzanie'||staff()).map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render().catch(fail)});$('content').innerHTML='<section>Ładowanie…</section>';await withAuth(async()=>{if(tab==='Treningi')await trainings();if(tab==='Wydarzenia')await events();if(tab==='Płatności')await payments();if(tab==='Statystyki')await statistics();if(tab==='Profil')await profileView();if(tab==='Zarządzanie')await manage()})}
function card(title,detail,extra=''){return `<div class="card"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(detail)}</p>${extra}</div>`}
async function trainings(){const data=await rest('trainings','select=*&order=starts_at.asc');const joins=await rest('training_members','select=training_id&user_id=eq.'+encodeURIComponent(profile.id));const joined=new Set(joins.map(x=>x.training_id));const now=Date.now();$('content').innerHTML='<h2>Treningi</h2>'+(data.map(t=>{const past=new Date(t.starts_at).getTime()<now;const isJoined=joined.has(t.id);const btn=past?'<span class="pill">Trening zakończony</span>':`<button data-training="${escapeHTML(t.id)}" data-action="${isJoined?'leave':'join'}">${isJoined?'Anuluj zapis':'Zapisz się'}</button>`;return card(t.title,new Date(t.starts_at).toLocaleString('pl-PL')+' • '+(t.location||''),btn)}).join('')||'<p>Brak treningów.</p>');$('content').querySelectorAll('[data-training]').forEach(b=>b.onclick=()=>run(async()=>{const id=b.dataset.training;const t=data.find(x=>x.id===id);if(!t||new Date(t.starts_at).getTime()<Date.now())throw Error('Nie można zmieniać zapisów na miniony trening.');if(b.dataset.action==='join'){await rest('training_members','',{method:'POST',body:{training_id:id,user_id:profile.id},headers:{Prefer:'return=minimal'}});notice('Zapisano na trening.')}else{if(!confirm('Anulować zapis na trening?'))return;await rest('training_members','training_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(profile.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});notice('Zapis anulowany.')}await render()}))}
async function events(){const data=await rest('events','select=*&order=starts_at.asc');$('content').innerHTML='<h2>Wydarzenia</h2>'+(data.map(e=>card(e.title,new Date(e.starts_at).toLocaleString('pl-PL')+' • '+(e.location||'')+' • '+(e.category||''))).join('')||'<p>Brak wydarzeń.</p>')}
async function payments(){const data=await rest('payments','select=*&user_id=eq.'+encodeURIComponent(profile.id)+'&order=created_at.desc');$('content').innerHTML='<h2>Moje płatności</h2><p class="muted">To ewidencja składek, nie bramka płatnicza.</p>'+(data.map(p=>card(p.title||p.description||'Składka',Number(p.amount).toFixed(2)+' PLN • '+(p.status==='paid'?'Opłacone':'Do zapłaty'))).join('')||'<p>Brak przypisanych płatności.</p>')}
async function statistics(){
 const allTrainings=await rest('trainings','select=id,title,starts_at&order=starts_at.desc');
 const trainingMap=new Map(allTrainings.map(t=>[t.id,t]));
 const now=Date.now();
 const myJoins=await rest('training_members','select=training_id,attended&user_id=eq.'+encodeURIComponent(profile.id));
 const pastJoins=myJoins.filter(j=>{const t=trainingMap.get(j.training_id);return t&&new Date(t.starts_at).getTime()<=now});
 const present=pastJoins.filter(j=>j.attended===true);
 const month=new Date().getMonth(),year=new Date().getFullYear();
 const thisMonth=present.filter(j=>{const d=new Date(trainingMap.get(j.training_id).starts_at);return d.getMonth()===month&&d.getFullYear()===year}).length;
 let html='<h2>Statystyki</h2><section><h3>Moje treningi</h3><p><strong>Potwierdzone obecności: '+present.length+'</strong></p><p>W tym miesiącu: '+thisMonth+'</p><p class="muted">Zakończone treningi, na które się zapisano: '+pastJoins.length+'. Obecność liczy się dopiero po potwierdzeniu przez prowadzącego.</p></section>';
 html+='<section><h3>Moja historia treningów</h3>'+(pastJoins.length?pastJoins.sort((a,b)=>new Date(trainingMap.get(b.training_id).starts_at)-new Date(trainingMap.get(a.training_id).starts_at)).map(j=>{const t=trainingMap.get(j.training_id);return card(t.title,new Date(t.starts_at).toLocaleString('pl-PL')+' • '+(j.attended===true?'Obecny':'Obecność niepotwierdzona'))}).join(''):'<p>Nie masz jeszcze zakończonych treningów na liście zapisów.</p>')+'</section>';
 if(admin()){
  html+='<section><h3>Statystyki członków</h3><p class="muted">Liczba potwierdzonych obecności na zakończonych treningach.</p><div id="memberStats">Ładowanie…</div></section>';
 }
 $('content').innerHTML=html;
 if(admin()){
  try{
   const [people,joins]=await Promise.all([rest('profiles','select=id,full_name,role&order=full_name.asc'),rest('training_members','select=user_id,training_id,attended&attended=eq.true')]);
   const counts=new Map();for(const j of joins){const t=trainingMap.get(j.training_id);if(t&&new Date(t.starts_at).getTime()<=now)counts.set(j.user_id,(counts.get(j.user_id)||0)+1)}
   $('memberStats').innerHTML=people.length?people.map(p=>card(p.full_name||'Bez nazwy',(counts.get(p.id)||0)+' potwierdzonych obecności')).join(''):'<p>Brak członków.</p>';
  }catch(e){$('memberStats').textContent='Nie udało się pobrać statystyk wszystkich członków: '+(e.message||e)}
 }
}
async function profileView(){$('content').innerHTML=`<section><h2>Profil</h2><p>${escapeHTML(profile.full_name)}</p><p>Status: ${profile.approved?'Aktywny':'Oczekujący'}</p><label>Nowe hasło<input type="password" id="newpass" autocomplete="new-password" minlength="8"></label><button id="changepass">Zmień hasło</button></section>`;$('changepass').onclick=()=>run(async()=>{if($('newpass').value.length<8)throw Error('Hasło musi mieć minimum 8 znaków.');await request('/auth/v1/user',{method:'PUT',body:{password:$('newpass').value}});$('newpass').value='';notice('Hasło zmienione.')})}
async function manage(){if(!staff())return;let html='<h2>Zarządzanie</h2>';let members=[];if(admin()){const pending=await rest('profiles','select=id,full_name,approved,role&approved=eq.false&order=created_at.asc');members=await rest('profiles','select=id,full_name,approved,role&order=full_name.asc');html+='<section><h3>Członkowie oczekujący</h3>'+(pending.map(p=>card(p.full_name,'Oczekuje na akceptację',`<button data-approve="${escapeHTML(p.id)}">Zatwierdź</button>`)).join('')||'<p>Brak oczekujących członków.</p>')+'</section>';html+='<section><h3>Wszyscy członkowie</h3><p class="muted">Lista kont i ich statusów.</p>'+(members.map(p=>card(p.full_name||'Bez nazwy','Rola: '+p.role+' • '+(p.approved?'Aktywny':'Oczekuje'),p.id===profile.id?'':`<button data-toggle="${escapeHTML(p.id)}" data-approved="${p.approved}">${p.approved?'Dezaktywuj':'Zatwierdź'}</button>`)).join('')||'<p>Brak członków.</p>')+'</section>'}const trainingList=await rest('trainings','select=*&order=starts_at.desc');html+='<section><h3>Lista obecności</h3><p class="muted">Wybierz trening, aby zobaczyć zapisanych i zaznaczyć obecność.</p><select id="attendanceTraining"><option value="">Wybierz trening</option>'+trainingList.map(t=>`<option value="${escapeHTML(t.id)}">${escapeHTML(t.title)} — ${escapeHTML(new Date(t.starts_at).toLocaleString('pl-PL'))}</option>`).join('')+'</select><div id="attendanceList"></div></section>';html+=`<section><h3>Dodaj trening</h3><form id="trainingform"><input name="title" placeholder="Nazwa treningu" required><label>Data i godzina<input name="starts_at" type="datetime-local" required></label><input name="location" placeholder="Miejsce"><button class="primary">Dodaj trening</button></form></section><section><h3>Dodaj wydarzenie</h3><form id="eventform"><input name="title" placeholder="Nazwa wydarzenia" required><label>Data i godzina<input name="starts_at" type="datetime-local" required></label><input name="location" placeholder="Miejsce"><select name="category"><option value="event">Wydarzenie</option><option value="seminar">Staż</option><option value="exam">Egzamin</option></select><button class="primary">Dodaj wydarzenie</button></form></section>`;if(admin())html+=`<section><h3>Dodaj należność</h3><form id="paymentform"><label>Członek<select name="user_id" id="memberselect" required></select></label><input name="title" placeholder="Tytuł składki" required><input name="description" placeholder="Dodatkowy opis (opcjonalnie)"><input name="amount" type="number" min="0.01" step="0.01" placeholder="Kwota PLN" required><button class="primary">Dodaj należność</button></form><h3>Oznacz wpłatę</h3><div id="unpaid"></div></section>`;$('content').innerHTML=html;const select=$('attendanceTraining');select.onchange=()=>run(async()=>{const target=$('attendanceList');target.textContent='Ładowanie…';if(!select.value){target.textContent='';return}const joins=await rest('training_members','select=user_id,attended&training_id=eq.'+encodeURIComponent(select.value));const ids=joins.map(j=>j.user_id);const people=ids.length?await rest('profiles','select=id,full_name&id=in.('+ids.join(',')+')'):[];const names=new Map(people.map(p=>[p.id,p.full_name]));target.innerHTML=joins.length?joins.map(j=>card(names.get(j.user_id)||'Członek',j.attended?'Obecny':'Niepotwierdzona obecność',`<button data-attend="${escapeHTML(j.user_id)}" data-value="${!j.attended}">${j.attended?'Cofnij obecność':'Potwierdź obecność'}</button>`)).join(''):'<p>Brak zapisanych osób.</p>';target.querySelectorAll('[data-attend]').forEach(b=>b.onclick=()=>run(async()=>{await rest('training_members','training_id=eq.'+encodeURIComponent(select.value)+'&user_id=eq.'+encodeURIComponent(b.dataset.attend),{method:'PATCH',body:{attended:b.dataset.value==='true'},headers:{Prefer:'return=minimal'}});notice('Zapisano obecność.');select.onchange()}))});if(admin()){$('content').querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Zatwierdzić członka?'))return;await rest('profiles','id=eq.'+encodeURIComponent(b.dataset.approve),{method:'PATCH',body:{approved:true},headers:{Prefer:'return=minimal'}});notice('Członek zatwierdzony.');await render()}));$('content').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>run(async()=>{const approved=b.dataset.approved==='true';if(!confirm(approved?'Dezaktywować konto członka?':'Zatwierdzić konto członka?'))return;await rest('profiles','id=eq.'+encodeURIComponent(b.dataset.toggle),{method:'PATCH',body:{approved:!approved},headers:{Prefer:'return=minimal'}});notice('Status członka zmieniony.');await render()}));$('memberselect').innerHTML=members.filter(m=>m.approved).map(m=>`<option value="${escapeHTML(m.id)}">${escapeHTML(m.full_name)}</option>`).join('');const unpaid=await rest('payments','select=*&status=eq.unpaid&order=created_at.desc');const names=new Map(members.map(m=>[m.id,m.full_name]));$('unpaid').innerHTML=unpaid.map(p=>card(p.title||p.description||'Składka', (names.get(p.user_id)||'Członek')+' • '+Number(p.amount).toFixed(2)+' PLN',`<button data-paid="${escapeHTML(p.id)}">Oznacz jako opłacone</button>`)).join('')||'<p>Brak nieopłaconych należności.</p>';$('unpaid').querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Potwierdzasz otrzymanie wpłaty?'))return;await rest('payments','id=eq.'+encodeURIComponent(b.dataset.paid),{method:'PATCH',body:{status:'paid'},headers:{Prefer:'return=minimal'}});notice('Wpłata oznaczona jako opłacona.');await render()}))}for(const [id,table] of [['trainingform','trainings'],['eventform','events'],['paymentform','payments']]){const f=$(id);if(!f)continue;f.onsubmit=e=>{e.preventDefault();run(async()=>{const d=Object.fromEntries(new FormData(f));if(d.starts_at)d.starts_at=new Date(d.starts_at).toISOString();if(d.amount)d.amount=Number(d.amount);if(table==='payments'){d.title=(d.title||'').trim();if(!d.title)throw Error('Podaj tytuł składki.');}await rest(table,'',{method:'POST',body:d,headers:{Prefer:'return=minimal'}});notice('Zapisano.');await render()})}}}
function fail(e){notice(e?.message||String(e),true)}async function run(fn){try{await fn()}catch(e){fail(e)}}$('login').onclick=()=>run(signIn);$('register').onclick=()=>run(register);$('forgot').onclick=()=>run(forgot);$('logout').onclick=logout;if(!configured){$('setup').classList.remove('hidden');$('auth').classList.add('hidden')}else{try{const s=JSON.parse(sessionStorage.getItem('tsurukan_session')||'null');if(s){session=s;run(loadUser)}}catch{}}
// Obsługa linku resetowania hasła z Supabase (implicit flow)
if(configured&&location.hash.includes('access_token=')){const h=new URLSearchParams(location.hash.slice(1));const access_token=h.get('access_token');if(access_token){saveSession({access_token,refresh_token:h.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+Number(h.get('expires_in')||3600)});history.replaceState(null,'',location.pathname);run(async()=>{const p=prompt('Wpisz nowe hasło (minimum 8 znaków):');if(p?.length>=8){await request('/auth/v1/user',{method:'PUT',body:{password:p}});notice('Hasło zmienione.')}await loadUser()})}}
</script></body></html>
